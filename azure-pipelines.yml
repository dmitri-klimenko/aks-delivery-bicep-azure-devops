trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-24.04

steps:
  - checkout: self
    persistCredentials: false

  - task: UseDotNet@2
    displayName: Install .NET 10 SDK
    inputs:
      packageType: sdk
      version: 10.x

  - script: dotnet restore Delivery.slnx
    displayName: Restore dependencies

  - script: >-
      dotnet test Delivery.slnx --configuration Release --no-restore
      --logger trx --results-directory "$(Agent.TempDirectory)/TestResults"
    displayName: Run endpoint tests

  - task: PublishTestResults@2
    displayName: Publish test results
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: VSTest
      testResultsFiles: '**/*.trx'
      searchFolder: '$(Agent.TempDirectory)/TestResults'
      failTaskOnFailedTests: true
      failTaskOnMissingResultsFile: true
      testRunTitle: Endpoint integration tests

  - script: docker build --platform linux/amd64 --tag aks-delivery:$(Build.BuildId) .
    displayName: Build AMD64 container image
